name: Runtime smoke tests

on:
  push:
    branches:
      - main
      - feature/central-usdt-catalogue
  pull_request:
    branches:
      - main

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile bot.py bot_v3.py bot_v4.py bot_v5.py central_catalog.py migrate_v3.py migrate_v4.py audit_dashboard.py
      - name: Run isolated migration and runtime tests
        run: python test_runtime.py
